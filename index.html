<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5611C">
<title>Menyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --fon:#F7F5F2; --oq:#FFFFFF; --matn:#16181D; --xira:#6B7079; --xira2:#9AA0A8; --chiziq:#ECE8E2;
    --mis:#D9822F; --mis-to:#B5611C; --mis-och:#FCEFE2;
    --soya:0 1px 2px rgba(22,24,29,.04),0 8px 24px -12px rgba(22,24,29,.12);
    --egri:cubic-bezier(.22,1,.36,1);
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fon);color:var(--matn);-webkit-font-smoothing:antialiased;font-size:15px}
  body.qulf{overflow:hidden}
  button,input{font-family:inherit}
  .quti{max-width:720px;margin:0 auto}

  /* ============ Muqova ============ */
  .muqova{height:190px;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 100% 0%,#F2A65A 0%,var(--mis) 35%,var(--mis-to) 75%,#8E4812 100%)}
  .muqova svg{position:absolute;inset:0;width:100%;height:100%;color:#fff;opacity:.12}
  .muqova .ust{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
  .til{display:flex;background:rgba(0,0,0,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px}
  .til[hidden]{display:none}
  .til button{border:0;background:transparent;color:rgba(255,255,255,.8);font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer;transition:.25s}
  .til button.faol{background:#fff;color:var(--matn)}
  .stol{display:none;align-items:center;gap:6px;background:#fff;color:var(--matn);font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;box-shadow:var(--soya)}
  .stol.bor{display:inline-flex}
  .stol svg{width:15px;height:15px;color:var(--mis)}

  /* ============ Restoran kartasi ============ */
  .rkarta{position:relative;margin:-54px 16px 0;background:var(--oq);border-radius:24px;box-shadow:var(--soya);padding:18px 18px 16px;animation:kotar .7s var(--egri) both}
  @keyframes kotar{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .rkarta .yuqori{display:flex;gap:14px;align-items:center}
  .logo{flex:0 0 58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;letter-spacing:.02em;
    background:linear-gradient(145deg,var(--mis),var(--mis-to));box-shadow:0 6px 16px -6px rgba(181,97,28,.6)}
  .rkarta h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .rkarta .sub{color:var(--xira);font-size:13.5px;margin-top:3px}
  .faktlar{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--chiziq);padding-top:14px}
  .fakt{text-align:center}
  .fakt+.fakt{border-left:1px solid var(--chiziq)}
  .fakt b{display:block;font-size:15px;font-weight:800}
  .fakt span{font-size:12px;color:var(--xira)}

  /* ============ Qidiruv ============ */
  .qidiruv{margin:14px 16px 0;position:relative}
  .qidiruv svg{position:absolute;left:15px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--xira2)}
  .qidiruv input{width:100%;border:1px solid var(--chiziq);background:var(--oq);border-radius:14px;padding:13px 14px 13px 44px;font-size:15px;color:var(--matn);outline:none;transition:border-color .2s,box-shadow .2s}
  .qidiruv input:focus{border-color:var(--mis);box-shadow:0 0 0 4px var(--mis-och)}

  /* ============ Kategoriya paneli ============ */
  nav{position:sticky;top:0;z-index:10;background:rgba(247,245,242,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-top:10px;transition:box-shadow .3s}
  nav.soya{box-shadow:0 1px 0 var(--chiziq),0 10px 20px -16px rgba(0,0,0,.25)}
  .tablar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
  .tablar::-webkit-scrollbar{display:none}
  .tablar a{flex:0 0 auto;text-decoration:none;color:var(--matn);background:var(--oq);border:1px solid var(--chiziq);font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .15s}
  .tablar a:active{transform:scale(.95)}
  .tablar a.faol{background:var(--matn);border-color:var(--matn);color:#fff}

  /* ============ Bo'lim sarlavhasi ============ */
  .bolimsar{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 12px}
  .bolimsar h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .bolimsar span{font-size:13px;color:var(--xira)}

  /* ============ Mashhur (gorizontal) ============ */
  .gor{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
  .gor::-webkit-scrollbar{display:none}
  .mk{flex:0 0 154px;scroll-snap-align:start;cursor:pointer;opacity:0;transform:translateY(16px);transition:opacity .6s var(--egri),transform .6s var(--egri)}
  .mk.korindi{opacity:1;transform:none}
  .mk:active .rasm{transform:scale(.96)}
  .mk .rasm{width:154px;height:154px;border-radius:var(--r);transition:transform .2s}
  .mk .nom{font-weight:700;font-size:14.5px;margin-top:9px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mk .nr{font-size:14px;font-weight:700;color:var(--mis-to);margin-top:3px}
  .belgi{position:absolute;top:10px;left:10px;z-index:2;background:#fff;color:var(--matn);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}

  /* ============ Taom qatori ============ */
  .ro{background:var(--oq);margin:0 16px;border-radius:22px;box-shadow:var(--soya);overflow:hidden}
  .qator{display:flex;gap:14px;padding:16px;cursor:pointer;position:relative;opacity:0;transform:translateY(14px);transition:opacity .55s var(--egri),transform .55s var(--egri),background .15s}
  .qator.korindi{opacity:1;transform:none}
  .qator+.qator::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--chiziq)}
  .qator:active{background:#FBFAF8}
  .qator .mat{flex:1;min-width:0;display:flex;flex-direction:column}
  .qator h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .qator p{color:var(--xira);font-size:13.5px;line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .qator .nr{margin-top:auto;padding-top:10px;font-size:15px;font-weight:800}
  .qator .nr small,.mk .nr small,.onarx small{color:var(--xira2);font-weight:500;font-size:12.5px;margin-left:2px}
  .qator .rasm{flex:0 0 104px;height:104px;border-radius:16px}

  /* ============ Rasm va o'rinbosar ============ */
  .rasm{position:relative;overflow:hidden;display:grid;place-items:center}
  .rasm .ik{width:42%;height:42%;opacity:.9}
  .rasm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
  .rasm img.tayyor{opacity:1}
  .t0{background:linear-gradient(145deg,#FDEBD8,#F8D6B3);color:#B5611C}
  .t1{background:linear-gradient(145deg,#FBE3DC,#F4C3B4);color:#B44A2C}
  .t2{background:linear-gradient(145deg,#EEF1DE,#DCE3BE);color:#6A7A2A}
  .t3{background:linear-gradient(145deg,#E3EEEA,#C6DDD5);color:#2F6E5E}
  .t4{background:linear-gradient(145deg,#ECE6F4,#D8CDEA);color:#5E4A8B}

  .bosh{padding:60px 24px;text-align:center;color:var(--xira);line-height:1.5}
  .bosh b{display:block;color:var(--matn);font-size:19px;margin-bottom:6px}
  .skelet{padding:22px 16px}
  .skelet div{height:120px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,#EEEAE4 25%,#F7F4F0 50%,#EEEAE4 75%);background-size:200% 100%;animation:yaltir 1.2s linear infinite}
  @keyframes yaltir{from{background-position:200% 0}to{background-position:-200% 0}}

  /* ============ Taom oynasi ============ */
  .parda{position:fixed;inset:0;z-index:30;background:rgba(16,17,20,.45);opacity:0;pointer-events:none;transition:opacity .35s}
  .parda.ochiq{opacity:1;pointer-events:auto}
  .oyna{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:720px;margin:0 auto;background:var(--oq);border-radius:28px 28px 0 0;
    transform:translateY(105%);transition:transform .5s var(--egri);max-height:92vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .oyna.ochiq{transform:none}
  .oyna .tutqich{position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.85);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .oyna .rasm{width:100%;aspect-ratio:4/3;max-height:48vh}
  .oyna .rasm .ik{width:30%;height:30%}
  .oyna .ichi{padding:20px 20px 0}
  .oyna .kat{display:inline-block;font-size:12px;font-weight:700;color:var(--mis-to);background:var(--mis-och);padding:5px 10px;border-radius:999px}
  .oyna h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:12px}
  .oyna p{color:var(--xira);font-size:15.5px;line-height:1.55;margin-top:10px}
  .oyna .past{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--chiziq)}
  .onarx{font-size:24px;font-weight:800}
  .oyna .yopish{border:0;background:var(--matn);color:#fff;font-size:15px;font-weight:700;padding:14px 22px;border-radius:14px;cursor:pointer}
  .oyna .yopish:active{transform:scale(.96)}
  .yopx{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:var(--matn);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15)}

  footer{text-align:center;padding:30px 16px calc(34px + env(safe-area-inset-bottom));color:var(--xira2);font-size:12px;line-height:1.7}
  footer .xizmat{color:var(--xira);font-size:13px;margin-bottom:10px}
  footer b{color:var(--xira);letter-spacing:.12em;font-size:11px}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .qator,.mk{opacity:1;transform:none}
  }
</style>
</head>

  }
  function som(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function narx(t) { return som(t.narx) + ' ' + T('sum') + '<small>/ ' + esc(t.olchov || 'porsiya') + '</small>'; }
  function kesh(k, v) {
    try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { return null; }
  }

  // Kategoriya nomiga qarab ikonka (rasm bo'lmaganda chiroyli o'rinbosar)
  function ikonka(kat) {
    var n = (kat || '').toLowerCase();
    if (/osh|palov|plov|lagmon|shurva|sho'rva|manti|chuchvara/.test(n)) return 'i-osh';
    if (/shashlik|kabob|kabab|go'sht|lyulya/.test(n)) return 'i-six';
    if (/non|patir|somsa|tandir/.test(n)) return 'i-non';
    if (/salat|sabzavot/.test(n)) return 'i-salat';
    if (/choy|ichimlik|kofe|sharbat|napitk|suv/.test(n)) return 'i-choy';
    return 'i-lagan';
  }
  function rasmHtml(t) {
    return '<div class="rasm t' + (t._ki % 5) + '" data-taom="' + esc(t.id) + '"><svg class="ik"><use href="#' + ikonka(t._kat) + '"/></svg></div>';
  }
  function holat(a, b) { $('asosiy').innerHTML = '<div class="bosh"><b>' + esc(a) + '</b>' + esc(b) + '</div>'; }

  function chiz(d) {
    joriy = d;
    var m = d.menyu || {};
    document.title = (d.nomi || 'Menyu');
    $('nomi').textContent = d.nomi || 'Menyu';
    $('logo').textContent = (d.nomi || 'M').split(/\s+/).slice(0, 2).map(function (s) { return s.charAt(0).toUpperCase(); }).join('');
    $('sub').textContent = T('sub');
    $('qidir').placeholder = T('qidir');

    var kat = (m.kategoriyalar || []).map(function (k, ki) {
      return { id: k.id, nomi: k.nomi, ki: ki, taomlar: (k.taomlar || []).filter(function (t) { return t.sotuvda !== false; }) };
    }).filter(function (k) { return k.taomlar.length; });

    if (!kat.length) { holat(T('yoqMenyu'), T('sora')); return; }

    taomlar = {};
    var jami = 0;
    kat.forEach(function (k) { k.taomlar.forEach(function (t) { t._kat = k.nomi; t._ki = k.ki; taomlar[t.id] = t; jami++; }); });

    var foiz = +m.xizmat_foiz || 0;
    $('faktlar').innerHTML =
      '<div class="fakt"><b>' + jami + '</b><span>' + T('taom') + '</span></div>' +
      '<div class="fakt"><b>' + kat.length + '</b><span>' + T('bolim') + '</span></div>' +
      '<div class="fakt"><b>' + (foiz ? foiz + '%' : T('yoq')) + '</b><span>' + T('xizmat') + '</span></div>';
    $('faktlar').hidden = false;

    // Mashhur: rasmli taomlar oldinda, har bo'limdan bittadan
    var tanlov = [];
    kat.forEach(function (k) { tanlov.push(k.taomlar.filter(function (t) { return t.rasm; })[0] || k.taomlar[0]); });

    var html = '<div class="blok" data-mashhur><div class="bolimsar"><h2>' + T('mashhur') + '</h2></div><div class="gor">';
    tanlov.slice(0, 8).forEach(function (t, i) {
      html += '<div class="mk" data-id="' + esc(t.id) + '" style="transition-delay:' + i * 70 + 'ms"><div style="position:relative">' +
        '<span class="belgi">' + T('mashhur') + '</span>' + rasmHtml(t) + '</div>' +
        '<div class="nom">' + esc(t.nomi) + '</div><div class="nr">' + narx(t) + '</div></div>';
    });
    html += '</div></div>';

    var tab = '';
    kat.forEach(function (k, i) {
      tab += '<a href="#k' + i + '" data-i="' + i + '"' + (i ? '' : ' class="faol"') + '>' + esc(k.nomi) + '</a>';
      html += '<section class="blok" id="k' + i + '" style="scroll-margin-top:60px"><div class="bolimsar"><h2>' + esc(k.nomi) + '</h2><span>' + k.taomlar.length + '</span></div><div class="ro">';
      k.taomlar.forEach(function (t, j) {
        html += '<div class="qator" data-id="' + esc(t.id) + '" data-q="' + esc((t.nomi + ' ' + (t.tavsif || '')).toLowerCase()) + '" style="transition-delay:' + (j % 6) * 60 + 'ms">' +
          '<div class="mat"><h3>' + esc(t.nomi) + '</h3>' + (t.tavsif ? '<p>' + esc(t.tavsif) + '</p>' : '') +
          '<div class="nr">' + narx(t) + '</div></div>' + rasmHtml(t) + '</div>';
      });
      html += '</div></section>';
    });
    html += '<div class="bosh" id="topilmadi" hidden><b>' + T('topilmadi') + '</b></div>';

    $('tablar').innerHTML = tab;
    $('nav').hidden = false;
    $('asosiy').innerHTML = html;
    $('pastki').innerHTML = (foiz ? '<div class="xizmat">' + T('xizmatTo').replace('{f}', foiz) + '</div>' : '') + '<b>EDMOND CONTROL</b>';
    $('pastki').hidden = false;
    $('oYop').textContent = T('yopish');

    kuzat();
    rasmlar(rasmKesh);
    if ($('qidir').value) filtr($('qidir').value);
  }

  function faolTab(i) {
    var a = null;
    document.querySelectorAll('.tablar a').forEach(function (x) {
      var f = x.getAttribute('data-i') === String(i);
      x.classList.toggle('faol', f);
      if (f) a = x;
    });
    if (a) { var t = $('tablar'); t.scrollTo({ left: a.offsetLeft - t.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth' }); }
  }

  function kuzat() {
    var els = document.querySelectorAll('.qator, .mk');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('korindi'); }); return; }
    var io = new IntersectionObserver(function (e) {
      e.forEach(function (x) {
        if (!x.isIntersecting) return;
        var el = x.target; el.classList.add('korindi'); io.unobserve(el);
        setTimeout(function () { el.style.transitionDelay = ''; }, 1000);
      });
    }, { rootMargin: '0px 0px -6% 0px' });
    els.forEach(function (e) { io.observe(e); });
    var bo = new IntersectionObserver(function (e) {
      e.forEach(function (x) { if (x.isIntersecting) faolTab(x.target.id.slice(1)); });
    }, { rootMargin: '-70px 0px -70% 0px' });
    document.querySelectorAll('section').forEach(function (s) { bo.observe(s); });
  }

  window.addEventListener('scroll', function () {
    var n = $('nav'); if (n) n.classList.toggle('soya', n.getBoundingClientRect().top <= 0);
  }, { passive: true });

  function rasmQoy(el, b) {
    if (!b || el.querySelector('img')) return;
    var img = new Image(); img.alt = '';
    img.onload = function () { img.classList.add('tayyor'); };
    img.src = 'data:image/jpeg;base64,' + b;
    el.appendChild(img);
  }
  function rasmlar(r) {
    if (!r) return; rasmKesh = r;
    document.querySelectorAll('.rasm[data-taom]').forEach(function (el) { rasmQoy(el, r[el.getAttribute('data-taom')]); });
  }

  // ---- Qidiruv ----
  $('qidir').addEventListener('input', function (e) { filtr(e.target.value); });
  function filtr(s) {
    s = s.trim().toLowerCase();
    var jami = 0;
    document.querySelectorAll('[data-mashhur]').forEach(function (b) { b.style.display = s ? 'none' : ''; });
    document.querySelectorAll('section').forEach(function (sec) {
      var bor = 0;
      sec.querySelectorAll('.qator').forEach(function (r) {
        var mos = !s || r.getAttribute('data-q').indexOf(s) >= 0;
        r.style.display = mos ? '' : 'none';
        if (mos) { bor++; r.classList.add('korindi'); }
      });
      sec.style.display = bor ? '' : 'none';
      jami += bor;
    });
    var tp = $('topilmadi'); if (tp) tp.hidden = jami > 0;
  }

  // ---- Til ----
  $('til').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    til = b.getAttribute('data-t');
    try { localStorage.setItem('menyu_til', til); } catch (x) {}
    tilBelgi();
    if (joriy) chiz(joriy);
  });
  function tilBelgi() {
    document.documentElement.lang = til;
    document.querySelectorAll('#til button').forEach(function (b) { b.classList.toggle('faol', b.getAttribute('data-t') === til); });
    $('qidir').placeholder = T('qidir'); $('sub').textContent = T('sub');
  }
  tilBelgi();

  // ---- Taom oynasi ----
  function och(id) {
    var t = taomlar[id]; if (!t) return;
    var r = $('oRasm');
    r.className = 'rasm t' + (t._ki % 5);
    r.innerHTML = '<svg class="ik"><use href="#' + ikonka(t._kat) + '"/></svg>';
    rasmQoy(r, rasmKesh[id]);
    $('oKat').textContent = t._kat || '';
    $('oNomi').textContent = t.nomi;
    $('oTavsif').textContent = t.tavsif || '';
    $('oTavsif').hidden = !t.tavsif;
    $('oNarx').innerHTML = narx(t);
    $('oyna').scrollTop = 0;
    $('parda').classList.add('ochiq'); $('oyna').classList.add('ochiq'); document.body.classList.add('qulf');
  }
  function yop() { $('parda').classList.remove('ochiq'); $('oyna').classList.remove('ochiq'); document.body.classList.remove('qulf'); }
  $('asosiy').addEventListener('click', function (e) { var k = e.target.closest('.qator, .mk'); if (k) och(k.getAttribute('data-id')); });
  $('parda').addEventListener('click', yop);
  $('oYop').addEventListener('click', yop);
  $('yopx').addEventListener('click', yop);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') yop(); });
  (function () {
    var y0 = null, o = $('oyna');
    o.addEventListener('touchstart', function (e) { if (o.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
    o.addEventListener('touchmove', function (e) {
      if (y0 === null) return; var d = e.touches[0].clientY - y0;
      if (d > 0) { o.style.transition = 'none'; o.style.transform = 'translateY(' + d + 'px)'; }
    }, { passive: true });
    o.addEventListener('touchend', function (e) {
      if (y0 === null) return; var d = e.changedTouches[0].clientY - y0;
      o.style.transition = ''; o.style.transform = ''; y0 = null; if (d > 100) yop();
    });
  })();

  // ---- To'liq ekran (Android Chrome: birinchi tegishda manzil qatori yashiriladi) ----
  (function () {
    var el = document.documentElement, sora = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!sora || !/Android/i.test(navigator.userAgent)) return;
    function bir(e) {
      if (e.target.closest && e.target.closest('input')) return;
      document.removeEventListener('click', bir, true);
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      try { var p = sora.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (x) {}
    }
    document.addEventListener('click', bir, true);
  })();

  // ---- Namuna: ?demo=1 ----
  if (demo) {
    if (!stol) stolKorsat('Stol 6');
    chiz({ nomi: 'Qodir aka choyxona', yangilangan: new Date().toISOString(), menyu: { xizmat_foiz: 10, kategoriyalar: [
      { id: 'a', nomi: 'Oshlar', taomlar: [
        { id: '1', nomi: 'Choyxona palov', tavsif: 'Devzira guruch, qazi va bedana tuxumi bilan, qozonda damlangan', narx: 45000, olchov: 'porsiya' },
        { id: '2', nomi: "To'y oshi", tavsif: "Mayiz, no'xat va yumshoq mol go'shti bilan", narx: 40000, olchov: 'porsiya' },
        { id: '3', nomi: "Qazi qo'shimcha", tavsif: '', narx: 25000, olchov: 'porsiya' }] },
      { id: 'b', nomi: 'Shashliklar', taomlar: [
        { id: '4', nomi: "Qo'y go'shti", tavsif: "Ko'mirda pishirilgan, piyoz va ziravorlar bilan", narx: 22000, olchov: 'six' },
        { id: '5', nomi: 'Jigar', tavsif: 'Dumba bilan', narx: 18000, olchov: 'six' },
        { id: '6', nomi: 'Lyulya kabob', tavsif: "Maydalangan qo'y go'shti", narx: 20000, olchov: 'six' }] },
      { id: 'c', nomi: 'Non va salatlar', taomlar: [
        { id: '7', nomi: 'Patir', tavsif: 'Tandirdan issiq', narx: 8000, olchov: 'dona' },
        { id: '8', nomi: 'Achchiq-chuchuk', tavsif: 'Pomidor, piyoz, rayhon', narx: 12000, olchov: 'porsiya' }] },
      { id: 'd', nomi: 'Choy va ichimliklar', taomlar: [
        { id: '9', nomi: "Ko'k choy", tavsif: '', narx: 5000, olchov: 'choynak' },
        { id: '10', nomi: 'Qora choy', tavsif: 'Limon bilan', narx: 6000, olchov: 'choynak' }] }
    ] } });
    return;
  }

  if (!/^[a-f0-9]{8}$/.test(kod)) { holat(T('qrXato'), T('qrXato2')); return; }
  var eski = kesh('menyu_' + kod);
  if (eski) chiz(eski);
  rpc('chy_menyu_ol', { p_kod: kod }).then(function (d) {
    if (!d) { if (!eski) holat(T('yoqMenyu'), T('sora')); return; }
    kesh('menyu_' + kod, d);
    if (!eski || eski.yangilangan !== d.yangilangan) chiz(d);
    return rpc('chy_rasmlar_ol', { p_kod: kod }).then(rasmlar);
  }).catch(function () { if (!eski) holat(T('netXato'), T('netXato2')); });
})();
</script>
</body>
</html>
