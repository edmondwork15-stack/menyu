<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1E23">
<title>Menyu</title>
<style>
  :root{
    --fon:#F6F1EA; --karta:#FFFFFF; --matn:#1B1E23; --xira:#7A7F87; --chiziq:#EAE2D6;
    --mis:#D9822F; --mis2:#B8661B; --misYumshoq:#FBEBDA; --tun:#1B1E23;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fon);color:var(--matn);-webkit-font-smoothing:antialiased;padding-bottom:40px}
  header{background:var(--tun);color:#fff;padding:26px 18px 22px;padding-top:calc(26px + env(safe-area-inset-top))}
  header h1{font-size:24px;font-weight:800;letter-spacing:.2px}
  header .pastki{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .stol{background:var(--mis);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:20px}
  .izoh{color:#AEB3BA;font-size:13px}
  nav{position:sticky;top:0;z-index:5;background:var(--fon);border-bottom:1px solid var(--chiziq)}
  nav .qator{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  nav .qator::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;text-decoration:none;color:var(--matn);background:var(--karta);border:1px solid var(--chiziq);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap}
  nav a.faol{background:var(--matn);color:#fff;border-color:var(--matn)}
  main{padding:4px 16px;max-width:760px;margin:0 auto}
  section{padding-top:18px;scroll-margin-top:62px}
  section h2{font-size:19px;font-weight:800;margin-bottom:12px}
  .taomlar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (min-width:600px){.taomlar{grid-template-columns:1fr 1fr 1fr}}
  .taom{background:var(--karta);border-radius:16px;overflow:hidden;border:1px solid var(--chiziq);display:flex;flex-direction:column}
  .rasm{aspect-ratio:4/3;background:linear-gradient(135deg,#E9A25A,#B8661B);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:36px;font-weight:800;position:relative}
  .rasm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
  .rasm img.tayyor{opacity:1}
  .malumot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .nomi{font-weight:700;font-size:15px;line-height:1.25}
  .tavsif{color:var(--xira);font-size:12.5px;line-height:1.3}
  .narx{margin-top:auto;padding-top:6px;font-weight:800;font-size:15px;color:var(--mis2)}
  .narx small{color:var(--xira);font-weight:500;font-size:12px}
  .holat{text-align:center;padding:70px 24px;color:var(--xira);font-size:15px;line-height:1.5}
  .holat b{display:block;color:var(--matn);font-size:18px;margin-bottom:6px}
  .aylana{width:34px;height:34px;border:3px solid var(--chiziq);border-top-color:var(--mis);border-radius:50%;margin:0 auto 14px;animation:ay 0.8s linear infinite}
  @keyframes ay{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--xira);font-size:12px;padding:28px 16px 0;line-height:1.6}
  footer .xizmat{color:var(--matn);font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1 id="nomi">Menyu</h1>
  <div class="pastki"><span class="stol" id="stol" hidden></span><span class="izoh" id="yangilangan"></span></div>
</header>
<nav hidden id="nav"><div class="qator" id="tablar"></div></nav>
<main id="asosiy"><div class="holat"><div class="aylana"></div>Menyu yuklanmoqda...</div></main>
<footer id="pastki" hidden></footer>

<script>
(function () {
  // EDMOND CONTROL Supabase. Kalit ochiq (publishable/anon) вЂ” faqat chy_menyu_ol va chy_rasmlar_ol RPC'larini chaqiradi.
  var SUPABASE_URL = 'https://csyxsoqiypmgkvoxeqhg.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzeXhzb3FpeXBtZ2t2b3hlcWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjg5NTcsImV4cCI6MjA5ODYwNDk1N30.G04OmJMhIHl7Myue2J-ftn3kGxhoUI1wO1oJh4lBeSg';

  var q = new URLSearchParams(location.search);
  var kod = (q.get('k') || '').trim();
  var stol = (q.get('s') || '').trim();
  var $ = function (id) { return document.getElementById(id); };

  if (stol) { $('stol').textContent = stol; $('stol').hidden = false; }

  function rpc(nomi, params) {
    var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
    if (SUPABASE_KEY.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + SUPABASE_KEY;
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + nomi, { method: 'POST', headers: h, body: JSON.stringify(params) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function som(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function holat(sarlavha, matn) {
    $('asosiy').innerHTML = '<div class="holat"><b>' + esc(sarlavha) + '</b>' + esc(matn) + '</div>';
  }
  function kesh(k, v) {
    try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { return null; }
  }

  function chiz(d) {
    var m = d.menyu || {};
    document.title = d.nomi + ' вЂ” menyu';
    $('nomi').textContent = d.nomi || 'Menyu';
    if (d.yangilangan) {
      var t = new Date(d.yangilangan);
      if (!isNaN(t)) $('yangilangan').textContent = 'Yangilangan: ' + t.toLocaleDateString('uz-UZ');
    }

    var kategoriyalar = (m.kategoriyalar || []).map(function (k) {
      return { id: k.id, nomi: k.nomi, taomlar: (k.taomlar || []).filter(function (t) { return t.sotuvda !== false; }) };
    }).filter(function (k) { return k.taomlar.length; });

    if (!kategoriyalar.length) { holat('Menyu hozircha bo\'sh', 'Iltimos, ofitsiantdan so\'rang.'); return; }

    var tab = '', html = '';
    kategoriyalar.forEach(function (k, i) {
      tab += '<a href="#k' + i + '" data-i="' + i + '"' + (i === 0 ? ' class="faol"' : '') + '>' + esc(k.nomi) + '</a>';
      html += '<section id="k' + i + '"><h2>' + esc(k.nomi) + '</h2><div class="taomlar">';
      k.taomlar.forEach(function (t) {
        var harf = esc((t.nomi || '?').trim().charAt(0).toUpperCase());
        html += '<div class="taom"><div class="rasm" data-taom="' + esc(t.id) + '">' + harf + '</div>' +
          '<div class="malumot"><div class="nomi">' + esc(t.nomi) + '</div>' +
          (t.tavsif ? '<div class="tavsif">' + esc(t.tavsif) + '</div>' : '') +
          '<div class="narx">' + som(t.narx) + ' so\'m <small>/ ' + esc(t.olchov || 'porsiya') + '</small></div></div></div>';
      });
      html += '</div></section>';
    });
    $('tablar').innerHTML = tab;
    $('nav').hidden = false;
    $('asosiy').innerHTML = html;

    var foiz = +m.xizmat_foiz || 0;
    $('pastki').innerHTML = (foiz > 0 ? '<div class="xizmat">Hisobga ' + foiz + '% xizmat haqi qo\'shiladi</div>' : '') +
      '<div>EDMOND CONTROL</div>';
    $('pastki').hidden = false;
    kuzat();
  }

  // Qaysi bo'limda turgan bo'lsa, yuqoridagi tab belgilanadi.
  function kuzat() {
    var tablar = [].slice.call(document.querySelectorAll('nav a'));
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (e) {
      e.forEach(function (x) {
        if (!x.isIntersecting) return;
        var i = x.target.id.slice(1);
        tablar.forEach(function (a) { a.classList.toggle('faol', a.getAttribute('data-i') === i); });
        var faol = tablar[+i];
        if (faol) faol.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      });
    }, { rootMargin: '-70px 0px -70% 0px' });
    document.querySelectorAll('section').forEach(function (s) { io.observe(s); });
  }

  function rasmlar(r) {
    if (!r) return;
    document.querySelectorAll('.rasm[data-taom]').forEach(function (el) {
      var b = r[el.getAttribute('data-taom')];
      if (!b || el.querySelector('img')) return;
      var img = new Image();
      img.alt = '';
      img.onload = function () { img.classList.add('tayyor'); };
      img.src = 'data:image/jpeg;base64,' + b;
      el.appendChild(img);
    });
  }

  if (!/^[a-f0-9]{8}$/.test(kod)) { holat('QR kod noto\'g\'ri', 'Stoldagi QR kodni qayta skanerlang.'); return; }

  var eski = kesh('menyu_' + kod);
  if (eski) chiz(eski);

  rpc('chy_menyu_ol', { p_kod: kod }).then(function (d) {
    if (!d) { if (!eski) holat('Menyu topilmadi', 'Iltimos, ofitsiantdan so\'rang.'); return; }
    kesh('menyu_' + kod, d);
    if (!eski || eski.yangilangan !== d.yangilangan) chiz(d);
    return rpc('chy_rasmlar_ol', { p_kod: kod }).then(rasmlar);
  }).catch(function () {
    if (!eski) holat('Internetga ulanib bo\'lmadi', 'Wi-Fi yoki mobil internetni tekshirib, sahifani yangilang.');
  });
})();
</script>
</body>
</html>
